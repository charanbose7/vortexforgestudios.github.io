<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" width="2048" height="1152">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&amp;family=Cinzel:wght@400&amp;display=swap');
    </style>
    <radialGradient id="cg" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#FF6B1A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#08060D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="2048" height="1152" fill="#08060D"/>
  <rect width="2048" height="1152" fill="url(#cg)"/>

  <!-- Vortex rings — decorative, TV/desktop only -->
  <circle cx="1024" cy="576" r="500" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="10 8" opacity="0.1"/>
  <circle cx="1024" cy="576" r="360" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="7 6" opacity="0.07"/>

  <!-- Corner brackets — TV only -->
  <line x1="60" y1="60"  x2="160" y2="60"  stroke="#C9922A" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <line x1="60" y1="60"  x2="60"  y2="160" stroke="#C9922A" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <line x1="1988" y1="60"  x2="1888" y2="60"  stroke="#C9922A" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <line x1="1988" y1="60"  x2="1988" y2="160" stroke="#C9922A" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <line x1="60"   y1="1092" x2="160"  y2="1092" stroke="#C9922A" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <line x1="60"   y1="1092" x2="60"   y2="992"  stroke="#C9922A" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <line x1="1988" y1="1092" x2="1888" y2="1092" stroke="#C9922A" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <line x1="1988" y1="1092" x2="1988" y2="992"  stroke="#C9922A" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>

  <!--
    Safe zone ALL DEVICES: x=251–1797, y=364–787 (1546×423px)
    Content kept inside: x=400–1680, y=400–760 (generous inset)
    Layout: Logo @ x=580 | Divider @ x=790 | Text @ x=1230
  -->

  <!-- Hex logo -->
  <g transform="translate(580, 576) scale(1.9)">
    <polygon points="0,-76 66,-38 66,38 0,76 -66,38 -66,-38"
      fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.55"/>
    <polygon points="0,-63 55,-31 55,31 0,63 -55,31 -55,-31"
      fill="#1a0800" stroke="#d97706" stroke-width="2"/>
    <rect x="-28" y="-42" width="56" height="22" rx="4" fill="#d97706"/>
    <rect x="-28" y="-42" width="56" height="7"  rx="4" fill="#F0C060" opacity="0.55"/>
    <rect x="-5"  y="-20" width="10" height="62" rx="4" fill="#b45309"/>
    <rect x="-10" y="-42" width="20" height="4"  rx="2" fill="#1a0800" opacity="0.4"/>
    <circle cx="0"   cy="-76" r="3.5" fill="#F0C060"/>
    <circle cx="66"  cy="-38" r="2.5" fill="#d97706" opacity="0.75"/>
    <circle cx="66"  cy="38"  r="2.5" fill="#d97706" opacity="0.75"/>
    <circle cx="0"   cy="76"  r="3.5" fill="#F0C060" opacity="0.5"/>
    <circle cx="-66" cy="-38" r="2.5" fill="#d97706" opacity="0.75"/>
    <circle cx="-66" cy="38"  r="2.5" fill="#d97706" opacity="0.75"/>
    <line x1="-28" y1="-42" x2="-40" y2="-54" stroke="#F0C060" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="28"  y1="-42" x2="40"  y2="-54" stroke="#F0C060" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="-34" y1="-32" x2="-50" y2="-32" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="34"  y1="-32" x2="50"  y2="-32" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="0"   y1="-42" x2="0"   y2="-58" stroke="#F0C060" stroke-width="1"   stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Vertical divider -->
  <line x1="796" y1="430" x2="796" y2="722" stroke="#C9922A" stroke-width="1.5" opacity="0.4"/>

  <!-- VORTEX FORGE -->
  <text x="1230" y="536"
    font-family="'Cinzel Decorative', serif"
    font-size="76"
    font-weight="900"
    fill="#F0C060"
    text-anchor="middle"
    letter-spacing="4">VORTEX FORGE</text>

  <!-- STUDIOS -->
  <text x="1230" y="632"
    font-family="'Cinzel Decorative', serif"
    font-size="76"
    font-weight="900"
    fill="#F0C060"
    text-anchor="middle"
    letter-spacing="4">STUDIOS</text>

  <!-- Divider under text -->
  <line x1="840" y1="664" x2="1620" y2="664" stroke="#C9922A" stroke-width="1" opacity="0.35"/>

  <!-- Tagline -->
  <text x="1230" y="706"
    font-family="'Cinzel', serif"
    font-size="26"
    font-weight="400"
    fill="#C9922A"
    text-anchor="middle"
    letter-spacing="12"
    opacity="0.8">AN INDIE GAME STUDIO</text>

</svg>
