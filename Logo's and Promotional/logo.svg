<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Outer dashed hex ring -->
  <polygon points="80,4 149,42 149,118 80,156 11,118 11,42"
    fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.55"/>
  <!-- Inner hex filled -->
  <polygon points="80,18 136,50 136,110 80,142 24,110 24,50"
    fill="#1a0800" stroke="#d97706" stroke-width="2"/>
  <!-- Hammer head -->
  <rect x="52" y="38" width="56" height="22" rx="4" fill="#d97706"/>
  <rect x="52" y="38" width="56" height="7"  rx="4" fill="#F0C060" opacity="0.55"/>
  <!-- Handle centered -->
  <rect x="75" y="60" width="10" height="62" rx="4" fill="#b45309"/>
  <!-- Notch on head -->
  <rect x="70" y="38" width="20" height="4" rx="2" fill="#1a0800" opacity="0.4"/>
  <!-- Corner glow dots -->
  <circle cx="80"  cy="4"   r="4" fill="#F0C060"/>
  <circle cx="149" cy="42"  r="3" fill="#d97706" opacity="0.75"/>
  <circle cx="149" cy="118" r="3" fill="#d97706" opacity="0.75"/>
  <circle cx="80"  cy="156" r="4" fill="#F0C060" opacity="0.5"/>
  <circle cx="11"  cy="118" r="3" fill="#d97706" opacity="0.75"/>
  <circle cx="11"  cy="42"  r="3" fill="#d97706" opacity="0.75"/>
  <!-- Sparks -->
  <line x1="52"  y1="38" x2="38"  y2="24" stroke="#F0C060" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="108" y1="38" x2="122" y2="24" stroke="#F0C060" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="46"  y1="46" x2="28"  y2="46" stroke="#d97706" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="114" y1="46" x2="132" y2="46" stroke="#d97706" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="80"  y1="38" x2="80"  y2="22" stroke="#F0C060" stroke-width="1"   stroke-linecap="round" opacity="0.5"/>
</svg>
