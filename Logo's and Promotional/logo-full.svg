<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&amp;family=Cinzel:wght@400&amp;display=swap');
    </style>
  </defs>


  <!-- Hex logo centered -->
  <g transform="translate(200, 100)">
    <!-- Outer dashed hex ring -->
    <polygon points="0,-76 66,-38 66,38 0,76 -66,38 -66,-38"
      fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.55"/>
    <!-- Inner hex filled -->
    <polygon points="0,-63 55,-31 55,31 0,63 -55,31 -55,-31"
      fill="#1a0800" stroke="#d97706" stroke-width="2"/>
    <!-- Hammer head -->
    <rect x="-28" y="-42" width="56" height="22" rx="4" fill="#d97706"/>
    <rect x="-28" y="-42" width="56" height="7"  rx="4" fill="#F0C060" opacity="0.55"/>
    <!-- Handle centered -->
    <rect x="-5"  y="-20" width="10" height="62" rx="4" fill="#b45309"/>
    <!-- Notch on head -->
    <rect x="-10" y="-42" width="20" height="4" rx="2" fill="#1a0800" opacity="0.4"/>
    <!-- Corner glow dots -->
    <circle cx="0"   cy="-76" r="3.5" fill="#F0C060"/>
    <circle cx="66"  cy="-38" r="2.5" fill="#d97706" opacity="0.75"/>
    <circle cx="66"  cy="38"  r="2.5" fill="#d97706" opacity="0.75"/>
    <circle cx="0"   cy="76"  r="3.5" fill="#F0C060" opacity="0.5"/>
    <circle cx="-66" cy="-38" r="2.5" fill="#d97706" opacity="0.75"/>
    <circle cx="-66" cy="38"  r="2.5" fill="#d97706" opacity="0.75"/>
    <!-- Sparks -->
    <line x1="-28" y1="-42" x2="-40" y2="-54" stroke="#F0C060" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="28"  y1="-42" x2="40"  y2="-54" stroke="#F0C060" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-34" y1="-32" x2="-50" y2="-32" stroke="#d97706" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="34"  y1="-32" x2="50"  y2="-32" stroke="#d97706" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="0"   y1="-42" x2="0"   y2="-58" stroke="#F0C060" stroke-width="1"   stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Divider line -->
  <line x1="120" y1="192" x2="280" y2="192" stroke="#C9922A" stroke-width="0.8" opacity="0.5"/>

  <!-- Company name -->
  <text x="200" y="222"
    font-family="'Cinzel Decorative', serif"
    font-size="22"
    font-weight="900"
    fill="#F0C060"
    text-anchor="middle"
    letter-spacing="2">VORTEX FORGE</text>
  <text x="200" y="248"
    font-family="'Cinzel Decorative', serif"
    font-size="22"
    font-weight="900"
    fill="#F0C060"
    text-anchor="middle"
    letter-spacing="2">STUDIOS</text>

  <!-- Subtitle -->
  <text x="200" y="268"
    font-family="'Cinzel', serif"
    font-size="8"
    font-weight="400"
    fill="#C9922A"
    text-anchor="middle"
    letter-spacing="4"
    opacity="0.8">AN INDIE GAME STUDIO</text>
</svg>
