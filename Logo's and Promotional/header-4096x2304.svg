<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4096 2304" width="4096" height="2304">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&amp;family=Cinzel:wght@400;600&amp;display=swap');
    </style>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF6B1A" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#08060D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottom-glow" cx="50%" cy="100%" r="50%">
      <stop offset="0%"   stop-color="#C9922A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#08060D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="4096" height="2304" fill="#08060D"/>
  <rect width="4096" height="2304" fill="url(#center-glow)"/>
  <rect width="4096" height="2304" fill="url(#bottom-glow)"/>

  <!-- Subtle vortex ring lines -->
  <circle cx="2048" cy="1152" r="900" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="12 10" opacity="0.12"/>
  <circle cx="2048" cy="1152" r="700" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="8 8"  opacity="0.09"/>
  <circle cx="2048" cy="1152" r="500" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="6 6"  opacity="0.08"/>

  <!-- Hex logo centered -->
  <g transform="translate(2048, 920) scale(5.5)">
    <polygon points="0,-76 66,-38 66,38 0,76 -66,38 -66,-38"
      fill="none" stroke="#b45309" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.55"/>
    <polygon points="0,-63 55,-31 55,31 0,63 -55,31 -55,-31"
      fill="#1a0800" stroke="#d97706" stroke-width="1.8"/>
    <rect x="-28" y="-42" width="56" height="22" rx="4" fill="#d97706"/>
    <rect x="-28" y="-42" width="56" height="7"  rx="4" fill="#F0C060" opacity="0.55"/>
    <rect x="-5"  y="-20" width="10" height="62" rx="4" fill="#b45309"/>
    <rect x="-10" y="-42" width="20" height="4"  rx="2" fill="#1a0800" opacity="0.4"/>
    <circle cx="0"   cy="-76" r="3.5" fill="#F0C060"/>
    <circle cx="66"  cy="-38" r="2.5" fill="#d97706" opacity="0.75"/>
    <circle cx="66"  cy="38"  r="2.5" fill="#d97706" opacity="0.75"/>
    <circle cx="0"   cy="76"  r="3.5" fill="#F0C060" opacity="0.5"/>
    <circle cx="-66" cy="-38" r="2.5" fill="#d97706" opacity="0.75"/>
    <circle cx="-66" cy="38"  r="2.5" fill="#d97706" opacity="0.75"/>
    <line x1="-28" y1="-42" x2="-40" y2="-54" stroke="#F0C060" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="28"  y1="-42" x2="40"  y2="-54" stroke="#F0C060" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="-34" y1="-32" x2="-50" y2="-32" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="34"  y1="-32" x2="50"  y2="-32" stroke="#d97706" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="0"   y1="-42" x2="0"   y2="-58" stroke="#F0C060" stroke-width="1"   stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Divider -->
  <line x1="1448" y1="1390" x2="2648" y2="1390" stroke="#C9922A" stroke-width="2" opacity="0.45"/>

  <!-- Studio name -->
  <text x="2048" y="1520"
    font-family="'Cinzel Decorative', serif"
    font-size="160"
    font-weight="900"
    fill="#F0C060"
    text-anchor="middle"
    letter-spacing="12">VORTEX FORGE</text>
  <text x="2048" y="1700"
    font-family="'Cinzel Decorative', serif"
    font-size="160"
    font-weight="900"
    fill="#F0C060"
    text-anchor="middle"
    letter-spacing="12">STUDIOS</text>

  <!-- Tagline -->
  <text x="2048" y="1820"
    font-family="'Cinzel', serif"
    font-size="52"
    font-weight="400"
    fill="#C9922A"
    text-anchor="middle"
    letter-spacing="22"
    opacity="0.75">AN INDIE GAME STUDIO</text>
</svg>
